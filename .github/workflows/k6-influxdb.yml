name: k6 Performance Test

on:
  workflow_dispatch:
  push:
    branches: main 
    
jobs:
  performance-test:
    runs-on: ubuntu-latest

    services:
      influxdb:
        image: influxdb:1.8
        ports:
          - 8086:8086
        options: >-
          --health-cmd="curl -f http://localhost:8086/ping || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        env:
          INFLUXDB_DB: k6

    steps:
      # ...existing steps...
      - name: Run k6 Load Test and push to InfluxDB
        env:
          INFLUXDB_URL: http://localhost:8086/k6
        run: |
          k6 run --out influxdb=$INFLUXDB_URL test.js